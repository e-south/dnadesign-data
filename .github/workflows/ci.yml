name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check uv lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Audit locked dependencies
        run: uv run pip-audit --local
      - name: Publication rights gate
        env:
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python -m dnadesign_data.devtools.publication_check --base-ref "$PUBLICATION_BASE"
      - name: Complete public-tree gate
        run: uv run python -m dnadesign_data.devtools.public_tree_check
      - name: Documentation contracts
        run: uv run python -m dnadesign_data.devtools.docs_check
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files
      - name: Pytest
        run: uv run pytest -q
      - name: CLI smoke
        run: |
          uv run dnadesign-data-ecocyc-go --help
          uv run dnadesign-data-biocyc-smarttables --help
          uv run dnadesign-data-sources list --kind all --indent 0
          uv run dnadesign-data-sources schema --indent 0
          uv run dnadesign-data-sources resolve regulondb_13_tf_riset --allow-missing --indent 0

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check uv lockfile
        run: uv lock --check
      - name: Build package
        run: uv build
      - name: Inspect package artifacts
        run: uv run python -m dnadesign_data.devtools.package_artifact_check
